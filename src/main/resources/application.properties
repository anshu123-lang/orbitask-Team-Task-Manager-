spring.application.name=team-task-manager
server.port=${PORT:8081}

# ============================================
# H2 In-Memory Database (default / local dev)
# ============================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT Configuration
# ============================================
jwt.secret=dGVhbVRhc2tNYW5hZ2VyU3VwZXJTZWNyZXRLZXlGb3JKV1RBdXRoZW50aWNhdGlvbjIwMjQ=
jwt.expiration=86400000

# ============================================
# Logging
# ============================================
logging.level.com.taskmanager=INFO
logging.level.org.springframework.security=WARN
